# Database connection configuration
DB_ENGINE=MYSQL
DB_HOST=127.0.0.1
DB_PORT=3306
DB_NAME=business_os
DB_USER=business
# Never commit a real password. Set BUSINESS_OS_DB_PASSWORD in the environment.
DB_PASSWORD_ENV=BUSINESS_OS_DB_PASSWORD
DB_CONNECT_TIMEOUT=10
DB_TLS=true
DB_POOL_SIZE=8
DB_MAX_RETRIES=3
DB_RETRY_DELAY_MS=1000
DB_CHARSET=utf8mb4
